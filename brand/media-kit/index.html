<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伍小梅 · 数字人形象</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg: #1A1008;
    --fg: #F5ECD7;
    --accent: #E8A440;
    --subtle: #2A1F14;
    --highlight: #FFF8EC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0D0804;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .portrait-card {
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .bg-glow {
    position: absolute;
    top: -20%;
    right: -15%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, rgba(232,164,64,0.08) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .bg-glow-bottom {
    position: absolute;
    bottom: -10%;
    left: -10%;
    width: 60%;
    height: 40%;
    background: radial-gradient(ellipse, rgba(232,164,64,0.05) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .accent-line-top {
    position: absolute;
    top: 0;
    left: 80px;
    right: 80px;
    height: 2px;
    background: var(--accent);
    opacity: 0.6;
    transform-origin: left;
  }

  .photo-area {
    position: absolute;
    top: 100px;
    left: 80px;
    right: 80px;
    bottom: 280px;
    background: var(--subtle);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }

  .photo-placeholder {
    text-align: center;
    color: rgba(245,236,215,0.2);
  }

  .photo-placeholder svg {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .photo-placeholder p {
    font-size: 18px;
    letter-spacing: 0.1em;
  }

  .photo-border {
    position: absolute;
    top: 92px;
    left: 72px;
    right: 72px;
    bottom: 272px;
    border: 1px solid rgba(232,164,64,0.25);
    border-radius: 10px;
    pointer-events: none;
  }

  .info-area {
    position: absolute;
    bottom: 80px;
    left: 80px;
    right: 80px;
  }

  .name {
    font-family: 'Noto Serif SC', serif;
    font-size: 72px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    letter-spacing: 0.08em;
  }

  .accent-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 12px 8px 4px;
    vertical-align: middle;
  }

  .title-line {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }

  .subtitle {
    font-size: 28px;
    font-weight: 400;
    color: rgba(245,236,215,0.65);
    letter-spacing: 0.06em;
  }

  .tag {
    display: inline-block;
    margin-top: 24px;
    padding: 8px 24px;
    border: 1px solid rgba(232,164,64,0.35);
    border-radius: 4px;
    font-size: 18px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.15em;
  }

  .accent-line-bottom {
    position: absolute;
    bottom: 50px;
    left: 80px;
    right: 80px;
    height: 1px;
    background: var(--accent);
    opacity: 0.3;
    transform-origin: right;
  }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: rgba(232,164,64,0.3);
    border-style: solid;
    pointer-events: none;
  }

  .corner-tr { top: 40px; right: 40px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 40px; left: 40px; border-width: 0 0 2px 2px; }
</style>
</head>
<body>
  <div class="portrait-card" id="portrait">
    <div class="bg-glow"></div>
    <div class="bg-glow-bottom"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="accent-line-top"></div>
    <div class="photo-border"></div>

    <div class="photo-area" id="photoArea">
      <img src="avatar-photo.jpg" alt="伍小梅">
      <div class="photo-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5z"/>
          <path d="M21 22v-1c0-3.31-2.69-6-6-6H9c-3.31 0-6 2.69-6 6v1"/>
        </svg>
        <p>放入你的照片</p>
      </div>
    </div>

    <div class="info-area">
      <div class="name">
        <span class="accent-dot"></span>伍小梅
      </div>
      <div class="title-line">
        <div class="divider"></div>
        <span class="subtitle">生命数字导师 · 女性成长教练</span>
      </div>
      <span class="tag">7年深耕 · 3000+案例</span>
    </div>

    <div class="accent-line-bottom"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    gsap.from(".bg-glow", { opacity: 0, duration: 1.2, ease: "power2.out" });
    gsap.from(".bg-glow-bottom", { opacity: 0, duration: 1.0, delay: 0.2, ease: "power2.out" });
    gsap.from(".corner", { opacity: 0, scale: 0.8, duration: 0.8, delay: 0.3, ease: "power3.out", stagger: 0.1 });
    gsap.from(".accent-line-top", { scaleX: 0, duration: 0.8, delay: 0.4, ease: "power3.inOut" });
    gsap.from(".photo-border", { opacity: 0, duration: 0.6, delay: 0.6, ease: "power2.out" });
    gsap.from("#photoArea", { opacity: 0, y: 20, duration: 0.7, delay: 0.7, ease: "power3.out" });
    gsap.from(".accent-dot", { scale: 0, duration: 0.4, delay: 0.9, ease: "back.out(2)" });
    gsap.from(".name", { opacity: 0, y: 30, duration: 0.6, delay: 1.0, ease: "power3.out" });
    gsap.from(".divider", { scaleX: 0, duration: 0.5, delay: 1.1, ease: "power2.out", transformOrigin: "left" });
    gsap.from(".subtitle", { opacity: 0, y: 15, duration: 0.5, delay: 1.2, ease: "power2.out" });
    gsap.from(".tag", { opacity: 0, y: 10, duration: 0.4, delay: 1.3, ease: "power2.out" });
    gsap.from(".accent-line-bottom", { scaleX: 0, duration: 0.6, delay: 1.2, ease: "power2.inOut", transformOrigin: "right" });

    gsap.to(".bg-glow", {
      opacity: 0.7, scale: 1.05,
      duration: 3, repeat: -1, yoyo: true, ease: "sine.inOut", delay: 1.5
    });
  </script>
</body>
</html>
