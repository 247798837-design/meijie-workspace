<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>梅姐飞轮 · 工作台</title>
<style>
:root{--paper:#fbf7ee;--card:#fffef9;--ink:#2c2416;--ink2:#5c4f3a;--ink3:#8a7b65;--gold:#b8860b;--goldL:#d4a843;--goldS:rgba(184,134,11,.1);--sage:#5b8c6f;--rose:#c77d7d;--r:14px;--sh:0 2px 16px rgba(44,36,22,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.shell{max-width:900px;margin:auto;padding:16px}
/* Header */
.hd{text-align:center;padding:28px 0 16px}.hd h1{font-size:26px;font-family:Georgia,"Songti SC",serif;color:#7f5f35}.hd .date{font-size:14px;color:var(--ink3);margin-top:4px}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh);border:1px solid rgba(44,36,22,.06)}.stat b{display:block;font-size:22px;color:var(--gold)}.stat span{font-size:11px;color:var(--ink3)}
/* Tab */
.tabs{display:flex;gap:4px;margin-bottom:16px}.tabs button{flex:1;border:1px solid rgba(44,36,22,.12);background:#fff;color:var(--ink2);border-radius:10px;padding:12px;cursor:pointer;font:inherit;font-weight:700;font-size:15px;transition:.15s}.tabs button.active{background:var(--gold);color:#fff;border-color:var(--gold)}.tabs button .sub{display:block;font-size:11px;font-weight:400;opacity:.7}
/* Card */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:1px solid rgba(44,36,22,.06);margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--goldS);color:var(--gold);font-weight:600;margin-left:auto}
/* Checklist */
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(44,36,22,.04)}.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--sage);cursor:pointer}.chk .done{text-decoration:line-through;color:var(--ink3)}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700}.t0{background:#ffe0e0;color:#c0392b}.t1{background:#fff3d4;color:#b8860b}.t2{background:#e0f0e8;color:#5b8c6f}.tf{background:#e8d5f5;color:#7b4fa0}
/* Flywheel */
.fly{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fly .f{display:flex;flex-direction:column;gap:3px}.fly .f label{font-size:11px;font-weight:600;color:var(--ink2)}
.fly .f input,.fly .f textarea{width:100%;border:1px solid rgba(44,36,22,.1);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px}
.fly .fw{grid-column:1/-1}.fly .fw textarea{min-height:44px;resize:vertical}
/* Summary */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sm{background:linear-gradient(135deg,#fbf7ee,#f7f3eb);border-radius:10px;padding:12px;text-align:center}.sm b{display:block;font-size:20px;color:var(--gold)}.sm span{font-size:11px;color:var(--ink3)}
/* Form */
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}.fld label{font-size:11px;font-weight:600;color:var(--ink2)}
.fld input,.fld textarea{width:100%;border:1px solid rgba(44,36,22,.1);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px}.fld textarea{min-height:60px;resize:vertical}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:7px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;gap:4px}.btn:active{transform:scale(.97)}.btn-p{background:var(--ink);color:#fff}.btn-s{background:var(--sage);color:#fff}.btn-o{background:#fff;color:var(--ink);border:1px solid rgba(44,36,22,.12)}.btn-r{background:var(--rose);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* Review Output */
.output{background:#27323a;color:#e0e8e0;border-radius:10px;padding:14px;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;margin-top:10px}
/* Links bar */
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.links a{font-size:12px;color:var(--ink3);text-decoration:none;padding:6px 12px;border-radius:20px;border:1px solid rgba(44,36,22,.1);transition:.15s}.links a:hover{color:var(--gold);border-color:var(--goldL)}
.foot{text-align:center;color:var(--ink3);font-size:12px;padding:20px 0}
/* Desktop layout */
@media(min-width:700px){
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2 .card{margin-bottom:0}
}
@media(max-width:500px){.fly{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">

  <div class="hd">
    <h1>🔄 梅姐飞轮 · 工作台</h1>
    <div class="date" id="todayLabel">---</div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="links">
    <a href="mobile/">📱 手机版</a>
    <a href="panels/five-mgmt/">📊 完整驾驶舱</a>
    <a href="https://chat.deepseek.com" target="_blank">🧠 DeepSeek</a>
    <a href="https://claude.ai" target="_blank">🤖 Claude</a>
  </div>

  <div class="tabs">
    <button id="tabDay" class="active" onclick="switchTab('day')">☀️ 白天执行<span class="sub">打勾·飞轮</span></button>
    <button id="tabNight" onclick="switchTab('night')">🌙 晚间复盘<span class="sub">汇总·复盘</span></button>
  </div>

  <!-- ═══ DAY TAB ═══ -->
  <div id="dayTab">
    <div class="grid2">
      <div class="card">
        <h2>📋 今日待办 <span class="badge" id="taskBadge">0/0</span></h2>
        <div id="taskList"></div>
        <div class="row">
          <input id="newTask" placeholder="添加任务，回车确认" style="flex:1;border:1px solid rgba(44,36,22,.1);border-radius:7px;padding:8px 10px;font:inherit;font-size:13px" onkeydown="if(event.key==='Enter')addTask()">
          <button class="btn btn-s" onclick="addTask()">+</button>
        </div>
      </div>
      <div class="card">
        <h2>💰 今日飞轮</h2>
        <div class="fly">
          <div class="f"><label>✍️ 写</label><input id="fwWrite" onchange="autoSave()"></div>
          <div class="f"><label>📹 拍</label><input id="fwShoot" onchange="autoSave()"></div>
          <div class="f"><label>📡 发</label><input id="fwPublish" onchange="autoSave()"></div>
          <div class="f"><label>🤝 连接</label><input id="fwConnect" type="number" min="0" onchange="autoSave()"></div>
          <div class="f"><label>🎯 需求</label><input id="fwNeed" type="number" min="0" onchange="autoSave()"></div>
          <div class="f"><label>💰 到账</label><input id="fwIncome" type="number" min="0" step="0.01" onchange="autoSave()"></div>
          <div class="f fw"><label>📝 复盘</label><textarea id="fwReview" onchange="autoSave()" placeholder="今天什么动作带来结果？"></textarea></div>
        </div>
        <div class="row"><span id="saved" style="font-size:11px;color:var(--sage)"></span></div>
      </div>
    </div>
  </div>

  <!-- ═══ NIGHT TAB ═══ -->
  <div id="nightTab" style="display:none">
    <div class="card">
      <h2>📊 今日概览</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="card">
      <h2>📋 任务完成</h2>
      <div id="taskReview"></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>🌿 心态复盘</h2>
        <div class="fld"><label>最佳恢复动作</label><input id="bestAction" onchange="saveReview()"></div>
        <div class="fld"><label>明天调整</label><input id="tomorrowAdjust" onchange="saveReview()"></div>
        <div class="fld"><label>晚间状态 (1-10)</label><input id="nightScore" type="number" min="1" max="10" onchange="saveReview()"></div>
      </div>
      <div class="card">
        <h2>✍️ 生成复盘</h2>
        <div class="row">
          <button class="btn btn-p" onclick="generateReview()">🔮 一键生成</button>
          <button class="btn btn-o" onclick="copyReview()">📋 复制</button>
          <button class="btn btn-r" onclick="exportMD()">📝 导出MD</button>
        </div>
        <div class="output" id="reviewOutput">点击「一键生成」查看今日复盘报告</div>
      </div>
    </div>
  </div>

  <div class="foot">梅姐飞轮 · 工作台 &nbsp;|&nbsp; <a href="https://github.com/247798837-design/meijie-workspace" style="color:var(--gold)">GitHub</a></div>
</div>

<script>
// ═══ STORAGE ═══
var SK='mei_five_management_v1',state={};
function L(){try{state=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){state={}}}
function S(){state._ts=Date.now();localStorage.setItem(SK,JSON.stringify(state))}
function G(k,d){var o=state,p=k.split('.');for(var i=0;i<p.length-1;i++){if(!o[p[i]])o[p[i]]={};o=o[p[i]]}if(o[p[p.length-1]]===undefined)o[p[p.length-1]]=d;return o[p[p.length-1]]}

// ═══ DATE ═══
function fmt(d){var w=['日','一','二','三','四','五','六'];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w[d.getDay()]}
function countdown(t){return Math.ceil((t-new Date())/(86400000))}
function daysSince(s){return Math.floor((new Date()-s)/(86400000))+1}
function today(){return new Date().toISOString().slice(0,10)}
var A={gaokao:new Date(2028,5,7),accompany:new Date(2026,2,1),deepwork:new Date(2023,9,15)};

// ═══ TAB SWITCH ═══
function switchTab(t){
  document.getElementById('dayTab').style.display=t==='day'?'block':'none';
  document.getElementById('nightTab').style.display=t==='night'?'block':'none';
  document.getElementById('tabDay').className=t==='day'?'active':'';
  document.getElementById('tabNight').className=t==='night'?'active':'';
  if(t==='night')renderNight();
}
var saveTimer;
function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){
  var fw=G('flywheel',{});
  fw.write=document.getElementById('fwWrite').value;fw.shoot=document.getElementById('fwShoot').value;
  fw.publish=document.getElementById('fwPublish').value;fw.connect=parseInt(document.getElementById('fwConnect').value)||0;
  fw.need=parseInt(document.getElementById('fwNeed').value)||0;fw.income=parseFloat(document.getElementById('fwIncome').value)||0;
  fw.review=document.getElementById('fwReview').value;S();
  document.getElementById('saved').textContent='已保存 '+new Date().toLocaleTimeString();
},400)}

// ═══ RENDER: DAY ═══
function renderDay(){
  L();var d=new Date();document.getElementById('todayLabel').textContent=fmt(d);
  document.getElementById('statsBar').innerHTML=
    '<div class="stat"><b>'+countdown(A.gaokao)+'</b><span>🎓 高考倒计时</span></div>'+
    '<div class="stat"><b>'+daysSince(A.deepwork)+'</b><span>💪 深耕密码</span></div>'+
    '<div class="stat"><b>'+daysSince(A.accompany)+'</b><span>🏠 陪读天数</span></div>';
  var tasks=G('tasks',[]);
  var done=tasks.filter(function(t){return t.done}).length;
  document.getElementById('taskBadge').textContent=done+'/'+tasks.length;
  document.getElementById('taskList').innerHTML=tasks.length?tasks.map(function(t,i){
    var cls=t.family?'tf':t.prio==='p0'?'t0':t.prio==='p1'?'t1':'t2';
    var lbl=t.family?'家':t.prio==='p0'?'P0':t.prio==='p1'?'P1':'';
    return '<div class="chk"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+i+')"><span class="'+(t.done?'done':'')+'">'+t.text+'</span>'+(lbl?'<span class="tag '+cls+'">'+lbl+'</span>':'')+'</div>';
  }).join(''):'<div style="text-align:center;padding:24px;color:var(--ink3)">还没有任务，输入后回车添加</div>';
  var fw=G('flywheel',{});
  document.getElementById('fwWrite').value=fw.write||'';document.getElementById('fwShoot').value=fw.shoot||'';
  document.getElementById('fwPublish').value=fw.publish||'';document.getElementById('fwConnect').value=fw.connect||'';
  document.getElementById('fwNeed').value=fw.need||'';document.getElementById('fwIncome').value=fw.income||'';
  document.getElementById('fwReview').value=fw.review||'';
}
function toggle(i){var t=G('tasks',[]);if(t[i]){t[i].done=!t[i].done;S();renderDay()}}
function addTask(){
  var v=document.getElementById('newTask').value.trim();if(!v)return;
  var tasks=G('tasks',[]);var prio=tasks.length===0?'p0':tasks.length===1?'p1':'p2';
  var family=v.indexOf('#家庭')>-1;if(family)v=v.replace('#家庭','').trim();
  tasks.unshift({text:v,prio:prio,done:false,family:family});S();
  document.getElementById('newTask').value='';renderDay();
}

// ═══ RENDER: NIGHT ═══
function renderNight(){
  L();
  var tasks=G('tasks',[]);var done=tasks.filter(function(t){return t.done});
  var fw=G('flywheel',{});var ms=G('mindset',{});
  document.getElementById('summary').innerHTML=
    '<div class="sm"><b>'+(tasks.length||'0')+'</b><span>总任务</span></div>'+
    '<div class="sm"><b>'+done.length+'/'+tasks.length+'</b><span>已完成</span></div>'+
    '<div class="sm"><b>¥'+(fw.income||0)+'</b><span>今日到账</span></div>'+
    '<div class="sm"><b>'+(fw.connect||0)+'人</b><span>连接</span></div>'+
    '<div class="sm"><b>'+(ms.energyScore||'—')+'分</b><span>能量</span></div>'+
    '<div class="sm"><b>'+(ms.morningMood||'—')+'/'+(ms.nightMood||'—')+'</b><span>晨/晚</span></div>';
  document.getElementById('taskReview').innerHTML=tasks.length?tasks.map(function(t){
    return '<div class="chk"><input type="checkbox" '+(t.done?'checked':'')+' disabled><span class="'+(t.done?'done':'')+'">'+t.text+'</span></div>';
  }).join(''):'<div style="text-align:center;padding:20px;color:var(--ink3)">今天没有记录</div>';
  var rv=G('review',{});
  document.getElementById('bestAction').value=rv.best||'';document.getElementById('tomorrowAdjust').value=rv.adjust||'';
  document.getElementById('nightScore').value=ms.nightMood||'';
}
function saveReview(){
  var rv=G('review',{});rv.best=document.getElementById('bestAction').value;
  rv.adjust=document.getElementById('tomorrowAdjust').value;rv.date=today();
  var ms=G('mindset',{});ms.nightMood=parseInt(document.getElementById('nightScore').value)||0;S();
}
function generateReview(){
  saveReview();L();var tasks=G('tasks',[]);var fw=G('flywheel',{});var ms=G('mindset',{});
  var done=tasks.filter(function(t){return t.done});var family=tasks.filter(function(t){return t.family&&t.done});
  var r='=== 梅姐晚间复盘 · '+today()+' ===\n\n【今日数据】\n';
  r+='📋 任务：'+done.length+'/'+tasks.length+'\n';
  tasks.forEach(function(t){r+='  '+(t.done?'✅':'⬜')+' '+t.text+(t.family?' 👨‍👩‍👦':'')+'\n'});
  r+='\n💰 飞轮：写='+(fw.write||'—')+' 拍='+(fw.shoot||'—')+' 发='+(fw.publish||'—');
  r+=' 连接='+(fw.connect||0)+' 需求='+(fw.need||0)+' 到账=¥'+(fw.income||0)+'\n';
  r+='🌿 心态：晨='+(ms.morningMood||'—')+' 晚='+(document.getElementById('nightScore').value||'—')+'\n';
  r+='💡 最佳动作：'+(document.getElementById('bestAction').value||'—');
  r+='\n🔧 明天调整：'+(document.getElementById('tomorrowAdjust').value||'—')+'\n';
  if(family.length)r+='\n👨‍👩‍👦 家庭：\n'+family.map(function(t){return '  ✅ '+t.text}).join('\n');
  r+='\n【明日计划】\n- [ ] ';
  document.getElementById('reviewOutput').textContent=r;
}
function copyReview(){var t=document.getElementById('reviewOutput').textContent;navigator.clipboard.writeText(t).then(function(){alert('已复制！')})}
function exportMD(){generateReview();var b=new Blob([document.getElementById('reviewOutput').textContent],{type:'text/markdown'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='复盘-'+today()+'.md';a.click()}

// ═══ INIT ═══
renderDay();
</script>
</body>
</html>
