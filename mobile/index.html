<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="梅姐飞轮">
<meta name="theme-color" content="#b8860b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="mei-logo-192.png">
<title>梅姐飞轮 · 赚钱操作系统</title>
<style>
:root{
--paper:#fbf7ee;--paper2:#f4efe4;--card:#fffef9;--ink:#2c2416;--ink2:#5c4f3a;--ink3:#8a7b65;
--gold:#b8860b;--goldL:#d4a843;--goldS:rgba(184,134,11,.1);--sage:#5b8c6f;--rose:#c77d7d;
--r:12px;--sh:0 2px 12px rgba(44,36,22,.06);--top:48px;--bot:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;overscroll-behavior:contain}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:rgba(251,247,238,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;border-bottom:1px solid rgba(44,36,22,.08)}
.topbar .date{font-size:13px;color:var(--ink2);font-weight:600}
.topbar .title{font-size:16px;font-weight:700}
.topbar button{background:none;border:none;font-size:20px;padding:8px;cursor:pointer;min-width:44px;min-height:44px}
#pages{flex:1;overflow-y:auto;padding:10px 12px;margin-top:var(--top);margin-bottom:var(--bot);-webkit-overflow-scrolling:touch}
.page{display:none;animation:fadeIn .2s ease}
.page.active{display:block}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:var(--bot);background:rgba(251,247,238,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;border-top:1px solid rgba(44,36,22,.08);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;font-size:10px;color:var(--ink3);cursor:pointer;transition:.15s;gap:2px;min-height:48px}
.tabbar button .ico{font-size:17px;line-height:1}
.tabbar button.active{color:var(--gold);font-weight:700;position:relative}
.tabbar button.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid rgba(44,36,22,.06);margin-bottom:10px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:15px;font-weight:700}
.card-hd .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--goldS);color:var(--gold);font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{text-align:center;background:var(--paper2);border-radius:10px;padding:10px 6px}
.kpi b{display:block;font-size:20px;color:var(--gold)}.kpi span{font-size:11px;color:var(--ink3)}
.kpi.highlight{background:linear-gradient(135deg,#fffaf2,#f4eadb);border:1px solid #d4af37}
.kpi.highlight b{color:#8b6914}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{text-align:center;background:var(--paper2);border-radius:10px;padding:10px 6px}
.stat b{display:block;font-size:20px;color:var(--gold)}.stat span{font-size:11px;color:var(--ink3)}
.chk{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(44,36,22,.06)}
.chk:last-child{border-bottom:0}.chk input{width:20px;height:20px;accent-color:var(--sage)}
.tag{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:700}.tag-p0{background:#ffe0e0;color:#c0392b}.tag-p1{background:#fff3d4;color:#b8860b}.tag-p2{background:#e0f0e8;color:#5b8c6f}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12px;font-weight:600;color:var(--ink2)}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid rgba(44,36,22,.12);background:#fff;border-radius:8px;padding:10px;font:inherit;font-size:14px;outline:none}
.fld textarea{min-height:60px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;gap:4px}
.btn:active{transform:scale(.97)}.btn-p{background:var(--ink);color:#fff}.btn-g{background:var(--gold);color:#fff}.btn-s{background:var(--sage);color:#fff}.btn-o{background:var(--paper2);color:var(--ink);border:1px solid rgba(44,36,22,.1)}.btn-r{background:var(--rose);color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pill{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;display:inline-block}
.pill-gold{background:var(--goldS);color:var(--gold)}.pill-sage{background:#e0f0e8;color:var(--sage)}.pill-rose{background:rgba(199,125,125,.1);color:var(--rose)}.pill-ink{background:rgba(44,36,22,.08);color:var(--ink2)}
.progress{height:6px;background:rgba(44,36,22,.08);border-radius:3px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#b8860b,#d4a843);border-radius:inherit}
.progress-steps{display:flex;gap:3px;margin:6px 0}
.progress-steps span{flex:1;height:5px;border-radius:3px;background:rgba(44,36,22,.1)}
.progress-steps span.done{background:var(--gold)}
.progress-steps span.current{background:var(--sage)}
.fly-card{border-left:3px solid var(--gold);padding-left:10px;margin-bottom:8px;background:var(--paper2);border-radius:0 var(--r) var(--r) 0;padding:10px 12px}
.fly-card h4{font-size:14px;margin-bottom:4px}.fly-card p{font-size:12px;color:var(--ink3);margin:2px 0}
.tree-item{padding:6px 0 6px 16px;border-left:2px solid rgba(44,36,22,.1);margin-left:8px}
.tree-root{font-weight:700;padding:8px 0;font-size:14px}
.funnel{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.funnel .step{flex:1;min-width:44px;text-align:center;padding:8px 4px;border-radius:8px;background:var(--paper2);font-size:11px}
.funnel .step b{display:block;font-size:16px}.funnel .step.active{background:var(--goldS);color:var(--gold)}
.chain-node{display:flex;align-items:center;gap:6px;padding:8px;border-radius:8px;background:var(--paper2);margin-bottom:4px;font-size:12px}
.chain-node .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}.dot-linked{background:var(--sage)}.dot-empty{background:rgba(44,36,22,.15)}
.chain-arrow{text-align:center;color:var(--ink3);font-size:14px;padding:2px 0}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;animation:fadeIn .3s ease;pointer-events:none}
.empty{text-align:center;padding:28px 12px;color:var(--ink3)}.empty .icon{font-size:36px;margin-bottom:6px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:24px 20px 32px;max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dual-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.section-label{font-size:12px;font-weight:700;color:var(--ink3);margin:14px 0 6px;letter-spacing:.04em}
.edu-card{border:1px solid #d4af37;background:linear-gradient(135deg,#f7f3eb,#fff)}
.warn{color:var(--rose);font-size:11px;margin-top:2px}
</style>
</head>
<body>

<header class="topbar">
  <span class="date" id="topDate">---</span>
  <span class="title" id="topTitle">今日驾驶舱</span>
  <button onclick="openSettings()" title="设置">⚙️</button>
</header>

<main id="pages">

<!-- ① 今日驾驶舱 -->
<section id="pg-cockpit" class="page active">
  <div class="stats3" id="cockpitStats"></div>
  <div id="morningHandoff" style="margin-bottom:10px"></div>
  <div class="kpi-grid" id="cockpitKPIs"></div>
  <div class="card"><div class="card-hd">🎯 今日3目标 <span class="badge" id="goalBadge">待确认</span></div><div id="cockpitGoals"></div></div>
  <div class="card"><div class="card-hd">✨ 今日肯定语 <span class="badge" id="affBadge">已确认</span></div><p id="affText" style="font-size:17px;font-weight:700;color:var(--rose);text-align:center;padding:12px 0">---</p><div class="row"><button class="btn btn-o" onclick="newAffirmation()">🔄 换一句</button><button class="btn btn-r" onclick="confirmAffirmation()">✅ 确认这句</button></div></div>
  <div class="card"><div class="card-hd">⚡ 快速操作</div><div class="row"><button class="btn btn-g" onclick="navTo('flywheel')">💰 查看赚钱飞轮</button><button class="btn btn-s" onclick="navTo('customers')">🤝 添加客户</button><button class="btn btn-o" onclick="navTo('review')">🌙 晚间复盘</button></div></div>
</section>

<!-- ② 赚钱飞轮 -->
<section id="pg-flywheel" class="page">
  <div class="card"><div class="card-hd">💰 赚钱主题卡 <span class="badge" id="rcBadge">0</span></div><div id="revenueCardsList"></div><button class="btn btn-g" style="width:100%;margin-top:8px" onclick="openRevenueCard()">+ 新建赚钱主题卡</button></div>
</section>

<!-- ③ 项目总览 -->
<section id="pg-projects" class="page">
  <div class="card"><div class="card-hd">📊 项目树</div><div id="projectTree"></div></div>
</section>

<!-- ④ 客户与收入 -->
<section id="pg-customers" class="page">
  <div class="card"><div class="card-hd">📊 客户漏斗</div><div class="funnel" id="custFunnel"></div></div>
  <div class="card"><div class="card-hd">💰 双账面板</div><div class="dual-col"><div class="kpi highlight"><span>梅姐个人收入</span><b id="dualMeijie">¥0</b></div><div class="kpi"><span>驿马利润·梅姐实收</span><b id="dualYima">¥0</b></div></div></div>
  <div class="card"><div class="card-hd">🤝 客户列表</div><input id="cSearch" placeholder="搜索姓名/需求" style="width:100%;border:1px solid rgba(44,36,22,.12);border-radius:8px;padding:10px;font:inherit;margin-bottom:8px" oninput="renderCustomers()"><div id="custList"></div><button class="btn btn-g" style="width:100%" onclick="openCustomerModal()">+ 添加客户</button></div>
</section>

<!-- ⑤ 知识生长 -->
<section id="pg-knowledge" class="page">
  <div class="card"><div class="card-hd">🧠 知识生长链</div><div id="knowledgeStats"></div><div id="knowledgeChains"></div></div>
  <div class="card"><div class="card-hd">📚 学习卡库存 <span class="badge" id="lcBadge">0</span></div><div id="learningCardsList"></div><button class="btn btn-o" style="width:100%" onclick="openLearningCardModal()">+ 新建学习卡</button></div>
</section>

<!-- ⑥ 晚间复盘 -->
<section id="pg-review" class="page">
  <div class="card"><div class="card-hd">📊 今日概览 <span class="badge" id="reviewDate"></span></div><div class="kpi-grid" id="reviewSummary"></div></div>
  <div class="card"><div class="card-hd">✍️ 六项复盘</div>
    <div class="fld"><label>💚 心态：今天最大的阻力/调整</label><input id="rvMindset" placeholder="例：害怕成交→主动聊了一个"></div>
    <div class="fld"><label>📖 学习：学习卡是否转化应用？</label><input id="rvLearning" placeholder="哪张卡？用在哪？结果？"></div>
    <div class="fld"><label>🎯 目标：今天的主目标完成了吗？</label><input id="rvGoals" placeholder="完成/未完成，原因"></div>
    <div class="fld"><label>⚡ 行动：今天最有效的一个动作</label><input id="rvAction" placeholder="什么动作真正推进了结果？"></div>
    <div class="fld"><label>⏰ 时间：哪个块被打断？明天怎么调？</label><input id="rvTime" placeholder="时间分配"></div>
    <div class="fld"><label>💰 客户：漏斗推到哪步？明天补哪环？</label><input id="rvCustomers" placeholder="客户推进"></div>
  </div>
  <div class="card"><div class="card-hd">🔮 明日交接</div>
    <div class="fld"><label>今日最大断点</label><input id="rvGap" placeholder="哪里卡住了？"></div>
    <div class="fld"><label>明日保留</label><input id="rvKeep" placeholder="继续做什么"></div>
    <div class="fld"><label>明日调整</label><input id="rvAdjust" placeholder="怎么改"></div>
    <div class="fld"><label>明日停止</label><input id="rvStop" placeholder="停掉什么"></div>
    <div class="fld"><label>明日P0（最重要的结果）</label><input id="rvP0" placeholder="必须完成的一件事"></div>
    <div class="fld"><label>明日P1（推进成交/客户）</label><input id="rvP1" placeholder="离钱最近的动作"></div>
    <div class="fld"><label>明日P2（公司职责/交付）</label><input id="rvP2" placeholder="不能拖延的交付"></div>
    <button class="btn btn-p" style="width:100%" onclick="confirmHandoff()">✅ 确认明日交接</button>
    <p id="handoffStatus" style="font-size:11px;color:var(--sage);margin-top:6px;text-align:center"></p>
  </div>
</section>

</main>

<nav class="tabbar">
  <button data-pg="cockpit" class="active"><span class="ico">🏠</span>驾驶舱</button>
  <button data-pg="flywheel"><span class="ico">💰</span>飞轮</button>
  <button data-pg="projects"><span class="ico">📊</span>项目</button>
  <button data-pg="customers"><span class="ico">🤝</span>客户</button>
  <button data-pg="knowledge"><span class="ico">🧠</span>知识</button>
  <button data-pg="review"><span class="ico">🌙</span>复盘</button>
</nav>

<div id="toastBox"></div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3 style="margin-bottom:16px">⚙️ 设置</h3>
    <button class="btn btn-p" style="width:100%;margin-bottom:8px" onclick="exportData()">📥 导出数据 (JSON备份)</button>
    <button class="btn btn-o" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">📤 导入数据</button>
    <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-o" style="width:100%;margin-bottom:8px" onclick="exportMarkdown()">📝 导出Markdown (Obsidian)</button>
    <button class="btn btn-s" style="width:100%;margin-bottom:8px" onclick="syncToCloud()">☁️ 同步到云端 (GitHub)</button>
    <button class="btn btn-o" style="width:100%;margin-bottom:8px" onclick="syncFromCloud()">⬇️ 从云端下载</button>
    <button class="btn btn-r" style="width:100%;margin-bottom:8px" onclick="clearAll()">🗑️ 清除所有数据</button>
    <button class="btn btn-o" style="width:100%" onclick="closeSettings()">关闭</button>
    <p id="syncStatus" style="font-size:11px;color:var(--sage);margin-top:8px;text-align:center"></p>
    <p id="storageInfo" style="font-size:11px;color:var(--ink3);margin-top:4px;text-align:center"></p>
  </div>
</div>

<!-- Revenue Card Modal -->
<div id="rcModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeRCModal()">
  <div class="modal"><h3 id="rcModalTitle">赚钱主题卡</h3>
    <div class="fld"><label>来源学习卡</label><select id="rcCard"><option>选择学习卡</option></select></div>
    <div class="fld"><label>用户问题</label><input id="rcProblem" placeholder="用户真正面对的问题"></div>
    <div class="fld"><label>当前阶段</label><select id="rcStage"><option value="testing">测试问题</option><option value="verified">已验证·有真实回应</option><option value="amplified">已放大·多平台内容</option><option value="matched">已匹配产品</option><option value="closed">已成交</option><option value="delivered">已交付</option></select></div>
    <div class="fld"><label>用户原话（一条一行）</label><textarea id="rcQuotes" rows="3" placeholder="复制用户真实说法"></textarea></div>
    <div class="fld"><label>下一步</label><input id="rcNext" placeholder="推进到下一阶段的具体动作"></div>
    <div class="fld"><label>匹配产品</label><select id="rcProduct"><option>待确认</option><option>1199产品</option><option>14999产品</option><option>49800产品</option><option>其他</option></select></div>
    <div class="fld"><label>收入线</label><select id="rcLine"><option value="meijie">梅姐个人收入</option><option value="yima">驿马善琰利润</option></select></div>
    <div class="fld"><label>实际到账 ¥</label><input id="rcIncome" type="number" min="0" step="0.01" placeholder="0"></div>
    <button class="btn btn-p" style="width:100%" onclick="saveRevenueCard()">保存主题卡</button>
    <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="closeRCModal()">取消</button>
  </div>
</div>

<!-- Customer Modal -->
<div id="custModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeCustModal()">
  <div class="modal"><h3 id="custModalTitle">添加客户</h3>
    <input id="cEditId" type="hidden">
    <div class="fld"><label>姓名</label><input id="cName" placeholder="必填"></div>
    <div class="fld"><label>来源</label><select id="cSource"><option>微信</option><option>视频号</option><option>小红书</option><option>公众号</option><option>直播</option><option>转介绍</option><option>其他</option></select></div>
    <div class="fld"><label>真实问题</label><input id="cProblem" placeholder="她最需要解决什么？"></div>
    <div class="fld"><label>阶段</label><select id="cStage"><option value="S0">S0 待触达</option><option value="S1">S1 刚认识</option><option value="S2">S2 有兴趣</option><option value="S3">S3 中意向</option><option value="S4">S4 高意向</option><option value="S5">S5 已成交</option></select></div>
    <div class="fld"><label>所属项目</label><select id="cProject"><option>梅姐个人IP</option><option>驿马·觉醒计划</option><option>驿马·幸福人生</option><option>其他</option></select></div>
    <div class="fld"><label>收入线</label><select id="cLine"><option value="meijie">梅姐个人收入</option><option value="yima">驿马善琰利润</option></select></div>
    <div class="fld"><label>意向产品</label><select id="cProduct"><option>待判断</option><option>1199产品</option><option>14999产品</option><option>49800产品</option><option>其他</option></select></div>
    <div class="fld"><label>关联学习卡</label><select id="cCard"><option>无</option></select></div>
    <div class="fld"><label>下一步行动</label><input id="cNextAction" placeholder="今天要做什么"></div>
    <div class="fld"><label>下次联系日期</label><input id="cNextDate" type="date"></div>
    <div class="fld"><label>成交金额 ¥</label><input id="cDealAmount" type="number" min="0" step="0.01" placeholder="0"></div>
    <div class="fld"><label>收款主体</label><select id="cPaySubject"><option>待确认</option><option>梅姐个人</option><option>驿马公司</option></select></div>
    <div class="fld"><label>梅姐实际到账 ¥</label><input id="cMeijieIncome" type="number" min="0" step="0.01" placeholder="0"></div>
    <div class="fld"><label>交付状态</label><select id="cDelivery"><option>未交付</option><option>交付中</option><option>已交付</option></select></div>
    <div class="fld"><label>备注</label><textarea id="cNote" rows="2" placeholder="跟进记录"></textarea></div>
    <button class="btn btn-p" style="width:100%" onclick="saveCustomer()">保存客户</button>
    <button class="btn btn-o" style="width:100%;margin-top:8px" onclick="closeCustModal()">取消</button>
  </div>
</div>

<!-- Learning Card Modal -->
<div id="lcModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeLCModal()">
  <div class="modal"><h3>新建学习卡</h3>
    <div class="fld"><label>标题</label><input id="lcTitle" placeholder="学习卡标题"></div>
    <div class="fld"><label>来源</label><select id="lcSource"><option>觉醒早课</option><option>会议纪要</option><option>课程</option><option>复盘</option><option>公众号</option><option>视频</option><option>其他</option></select></div>

  const hasKids=node.children&&node.children.length;
  let html='<div class="'+(depth===0?'tree-root':'tree-item')+'"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+(depth===0?'📁 ':'📌 ')+node.name+'</b><span class="pill pill-ink">'+(node.metric||node.goal||'')+'</span></div>';

  return html;
}

    return '<div class="fly-card" onclick="openCustomerModal('+idx+')"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+(c.name||'未命名')+'</b><span class="pill pill-gold">'+labels[c.stage]+'</span></div><p>'+(c.realProblem||'无问题记录')+' · '+(c.project||'')+' · '+(c.revenueLine==='yima'?'驿马':'梅姐')+'</p>'+(c.nextAction?'<p style="color:var(--sage)">→ '+c.nextAction+(c.nextDate?' · '+c.nextDate:'')+'</p>':'')+'</div>';
  }).join(''):'<div class="empty"><div class="icon">🤝</div>还没有客户</div>';
}

function openCustomerModal(idx){

  document.getElementById('cCard').innerHTML='<option value="">无</option>'+lc.map(c=>'<option value="'+c.id+'">'+c.title+'</option>').join('');

    document.getElementById('custModalTitle').textContent='编辑客户';
    document.getElementById('cEditId').value=idx;
    document.getElementById('cName').value=c.name||'';
    document.getElementById('cSource').value=c.source||'微信';
    document.getElementById('cProblem').value=c.realProblem||'';
    document.getElementById('cStage').value=c.stage||'S0';
    document.getElementById('cProject').value=c.project||'梅姐个人IP';
    document.getElementById('cLine').value=c.revenueLine||'meijie';
    document.getElementById('cProduct').value=c.product||'待判断';
    document.getElementById('cCard').value=c.linkedCardId||'';
    document.getElementById('cNextAction').value=c.nextAction||'';
    document.getElementById('cNextDate').value=c.nextDate||'';
    document.getElementById('cDealAmount').value=c.dealAmount||'';
    document.getElementById('cPaySubject').value=c.paymentSubject||'待确认';
    document.getElementById('cMeijieIncome').value=c.meijieActualIncome||'';
    document.getElementById('cDelivery').value=c.deliveryStatus||'未交付';
    document.getElementById('cNote').value=c.note||'';
  }else{
    document.getElementById('custModalTitle').textContent='添加客户';
    ['cEditId','cName','cProblem','cNextAction','cNextDate','cDealAmount','cMeijieIncome','cNote'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('cStage').value='S0';
    document.getElementById('cLine').value='meijie';
    document.getElementById('cProject').value='梅姐个人IP';

    document.getElementById('cDelivery').value='未交付';
  }
  document.getElementById('custModal').style.display='flex';
}
function closeCustModal(){document.getElementById('custModal').style.display='none'}
function saveCustomer(){
  const cr=ns('customerRecords',[]);
  const cust={
    name:document.getElementById('cName').value||'未命名',
    source:document.getElementById('cSource').value,
    realProblem:document.getElementById('cProblem').value,
    stage:document.getElementById('cStage').value,
    project:document.getElementById('cProject').value,
    revenueLine:document.getElementById('cLine').value,
    product:document.getElementById('cProduct').value,
    linkedCardId:document.getElementById('cCard').value,
    nextAction:document.getElementById('cNextAction').value,
    nextDate:document.getElementById('cNextDate').value,
    dealAmount:parseFloat(document.getElementById('cDealAmount').value)||0,
    paymentSubject:document.getElementById('cPaySubject').value,
    meijieActualIncome:parseFloat(document.getElementById('cMeijieIncome').value)||0,
    deliveryStatus:document.getElementById('cDelivery').value,
    note:document.getElementById('cNote').value,
    updated:today()
  };
  const idx=parseInt(document.getElementById('cEditId').value);
  if(!isNaN(idx)&&cr[idx]){cr[idx]={...cr[idx],...cust}}else{cr.push({...cust,added:today()})}
  // Update dual accounts
  if(cust.meijieActualIncome>0){
    if(cust.revenueLine==='meijie')updateDualAccounts('meijie',cust.meijieActualIncome);
    else updateDualAccounts('yima',cust.meijieActualIncome);
  }
  save();closeCustModal();renderCustomers();toast('客户已保存');
}

function updateDualAccounts(line,amount){
  const da=ns('dualAccounts',{meijie:{deals:[],totalIncome:0},yima:{deals:[],totalRevenue:0,meijieShare:0}});
  if(line==='meijie'){da.meijie.deals.push({date:today(),amount});da.meijie.totalIncome=(da.meijie.totalIncome||0)+amount}
  else{da.yima.deals.push({date:today(),amount});da.yima.totalRevenue=(da.yima.totalRevenue||0)+amount;da.yima.meijieShare=(da.yima.meijieShare||0)+amount}
  save();
}

// ── ⑤ 知识生长 ──
function renderKnowledge(){
  const lc=ns('learningCards',[]),rc=ns('revenueCards',[]),cr=ns('customerRecords',[]);
  document.getElementById('lcBadge').textContent=lc.length;

  // Knowledge stats
  const applied=lc.filter(c=>rc.some(r=>r.sourceCard===c.id)||cr.some(x=>x.linkedCardId===c.id));
  const unused=lc.filter(c=>!rc.some(r=>r.sourceCard===c.id)&&!cr.some(x=>x.linkedCardId===c.id));
  document.getElementById('knowledgeStats').innerHTML=
    '<div class="dual-col"><div class="kpi highlight"><b>'+lc.length+'</b><span>总学习卡</span></div><div class="kpi"><b>'+applied.length+'</b><span>已应用</span></div></div>'+
    (unused.length?'<p class="warn">⚠️ '+unused.length+'张卡长期未应用：'+unused.slice(0,3).map(c=>c.title).join('、')+'</p>':'');

  // Knowledge chains
  document.getElementById('knowledgeChains').innerHTML=lc.length?lc.slice(0,10).map(c=>{
    const linkedRC=rc.filter(r=>r.sourceCard===c.id);
    const linkedCust=cr.filter(x=>x.linkedCardId===c.id);
    const hasContent=linkedRC.some(r=>r.stage==='amplified');
    const hasRevenue=linkedRC.some(r=>r.actualIncome>0);
    return '<div class="fly-card"><b>'+c.title+'</b><div style="display:flex;gap:8px;margin-top:4px"><span class="chain-node"><span class="dot '+(linkedRC.length?'dot-linked':'dot-empty')+'"></span>主题卡:'+linkedRC.length+'</span><span class="chain-node"><span class="dot '+(hasContent?'dot-linked':'dot-empty')+'"></span>内容</span><span class="chain-node"><span class="dot '+(linkedCust.length?'dot-linked':'dot-empty')+'"></span>客户:'+linkedCust.length+'</span><span class="chain-node"><span class="dot '+(hasRevenue?'dot-linked':'dot-empty')+'"></span>到账</span></div></div>';
  }).join(''):'<div class="empty"><div class="icon">🧠</div>还没有学习卡</div>';

  // Learning cards list
  document.getElementById('learningCardsList').innerHTML=lc.length?lc.map((c,i)=>
    '<div class="fly-card"><b>'+c.title+'</b><span class="pill pill-ink" style="float:right">'+c.source+'</span><p>'+c.core+'</p><p style="color:var(--sage)">→ '+c.application+'</p></div>'
  ).join(''):'<div class="empty">新建第一张学习卡</div>';
}

function openLearningCardModal(){document.getElementById('lcModal').style.display='flex'}
function closeLCModal(){document.getElementById('lcModal').style.display='none'}
function saveLearningCard(){
  const lc=ns('learningCards',[]);
  lc.push({
    id:'lc_'+Date.now(),
    title:document.getElementById('lcTitle').value||'未命名',
    source:document.getElementById('lcSource').value,

    date:today(),status:'待应用'
  });
  save();closeLCModal();['lcTitle','lcCore','lcProblem','lcApply'].forEach(id=>document.getElementById(id).value='');
  renderKnowledge();toast('学习卡已保存');
}

// ── ⑥ 晚间复盘 ──
function renderReview(){
  document.getElementById('reviewDate').textContent=today();
  const cr=ns('customerRecords',[]),rc=ns('revenueCards',[]),da=ns('dualAccounts',{meijie:{totalIncome:0},yima:{meijieShare:0}});
  document.getElementById('reviewSummary').innerHTML=
    '<div class="kpi"><span>今日任务</span><b>'+(state.tasks||[]).filter(t=>t.done).length+'/'+(state.tasks||[]).length+'</b></div>'+
    '<div class="kpi"><span>飞轮主题</span><b>'+rc.length+'个</b></div>'+
    '<div class="kpi"><span>跟进客户</span><b>'+cr.filter(c=>c.stage!=='S5').length+'人</b></div>'+
    '<div class="kpi"><span>个人到账</span><b>¥'+(da.meijie.totalIncome||0).toLocaleString()+'</b></div>';

  // Load existing review
  const ho=ns('eveningHandoff',{});
  if(ho.date===today()){
    document.getElementById('rvMindset').value=ho.mindset||'';
    document.getElementById('rvLearning').value=ho.learning||'';
    document.getElementById('rvGoals').value=ho.goals||'';
    document.getElementById('rvAction').value=ho.action||'';
    document.getElementById('rvTime').value=ho.time||'';
    document.getElementById('rvCustomers').value=ho.customers||'';
    document.getElementById('rvGap').value=ho.gap||'';
    document.getElementById('rvKeep').value=ho.keep||'';
    document.getElementById('rvAdjust').value=ho.adjust||'';
    document.getElementById('rvStop').value=ho.stop||'';
    document.getElementById('rvP0').value=(ho.tomorrowGoals||[]).find(g=>g.prio==='P0')?.text||'';
    document.getElementById('rvP1').value=(ho.tomorrowGoals||[]).find(g=>g.prio==='P1')?.text||'';
    document.getElementById('rvP2').value=(ho.tomorrowGoals||[]).find(g=>g.prio==='P2')?.text||'';
    document.getElementById('handoffStatus').textContent='已确认 · 明日可读取';
  }else{
    // Auto-suggest P0/P1/P2
    const undone=state.tasks?.filter(t=>!t.done).map(t=>t.text)||[];
    const custNext=cr.filter(c=>c.nextDate&&c.stage!=='S5').sort((a,b)=>new Date(a.nextDate)-new Date(b.nextDate))[0];
    const rcNext=rc.filter(r=>r.stage!=='delivered'&&r.nextStep).slice(0,1);
    document.getElementById('rvP0').value=undone[0]||'';
    document.getElementById('rvP1').value=custNext?(custNext.name+': '+custNext.nextAction):'';
    document.getElementById('rvP2').value=rcNext[0]?.nextStep||'';
    document.getElementById('handoffStatus').textContent='请填写复盘后确认交接';
  }
}

function confirmHandoff(){
  const ho=ns('eveningHandoff',{});
  ho.date=today();
  ho.mindset=document.getElementById('rvMindset').value;
  ho.learning=document.getElementById('rvLearning').value;
  ho.goals=document.getElementById('rvGoals').value;
  ho.action=document.getElementById('rvAction').value;
  ho.time=document.getElementById('rvTime').value;
  ho.customers=document.getElementById('rvCustomers').value;
  ho.gap=document.getElementById('rvGap').value;
  ho.keep=document.getElementById('rvKeep').value;
  ho.adjust=document.getElementById('rvAdjust').value;
  ho.stop=document.getElementById('rvStop').value;
  ho.tomorrowGoals=[
    {prio:'P0',text:document.getElementById('rvP0').value||'待填写',from:'复盘交接'},
    {prio:'P1',text:document.getElementById('rvP1').value||'待填写',from:'复盘交接'},
    {prio:'P2',text:document.getElementById('rvP2').value||'待填写',from:'复盘交接'}
  ].filter(g=>g.text!=='待填写');
  save();
  document.getElementById('handoffStatus').textContent='✅ 已确认 · 明日驾驶舱可读取';
  toast('明日交接已确认！');
}

function openSettings(){document.getElementById('settingsModal').style.display='flex';updateStorageInfo()}
function closeSettings(){document.getElementById('settingsModal').style.display='none'}
function updateStorageInfo(){
  const d=JSON.stringify(state).length;
  document.getElementById('storageInfo').textContent='已使用 '+(d/1024).toFixed(1)+' KB / 约 5MB';
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='meijie-workspace-'+today()+'.json';a.click();toast('数据已导出');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{state=JSON.parse(ev.target.result);state._version=2;save();renderAll();toast('数据已导入！')}catch(e){toast('文件格式错误')}
  };reader.readAsText(file);
}
function clearAll(){
  if(confirm('确定要清除所有数据吗？此操作不可恢复！\n建议先导出备份。')){
    localStorage.removeItem(SK);state={_version:2};save();renderAll();toast('数据已清除');
  }
}

// GITHUB SYNC
// ═══════════════════════════════════════════
var GH={owner:'247798837-design',repo:'meijie-workspace',path:'data.json'};
function ghToken(){
  var t=localStorage.getItem('mei_gh_token');
  if(!t){t=prompt('首次使用云同步，请输入GitHub Token');if(t)localStorage.setItem('mei_gh_token',t)}
  return t}
async function syncToCloud(){
  var token=ghToken();if(!token)return;var s=document.getElementById('syncStatus');s.textContent='上传中…';
  try{var sha='';try{var r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path,{headers:{Authorization:'Bearer '+token}});if(r.ok){var d=await r.json();sha=d.sha}}catch(e){}var body={message:'phone sync '+new Date().toLocaleString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))))};if(sha)body.sha=sha;r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){s.textContent='✅ 已同步 '+new Date().toLocaleTimeString();toast('同步成功！')}else{var e=await r.json();s.textContent='❌ '+e.message;toast('同步失败')}}catch(e){s.textContent='❌ 网络错误';toast('网络错误')}}
async function syncFromCloud(){
  var token=ghToken();if(!token)return;var s=document.getElementById('syncStatus');s.textContent='下载中…';
  try{var r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path,{headers:{Authorization:'Bearer '+token}});if(!r.ok){s.textContent='云端暂无数据';toast('请先上传');return}var d=await r.json();state=JSON.parse(decodeURIComponent(escape(atob(d.content))));state._version=2;save();renderAll();s.textContent='✅ 已下载';toast('下载成功！')}catch(e){s.textContent='❌ 下载失败';toast('下载失败')}}
